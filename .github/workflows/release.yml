name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Creating the release and uploading its assets writes to the repository. The default token
# grant is read-only, and a reusable workflow cannot request more than its caller was given.
permissions:
  contents: write

jobs:
  release:
    uses: damianhoward/.github/.github/workflows/release.yml@main
    with:
      # `build` covers the distribution: the application plugin wires distTar and distZip into
      # assemble, so the archives staged below are the ones the verified build produced.
      build-command: clean build
      artifact-paths: |
        build/distributions/bank-csv-to-qif-*.tar
        build/distributions/bank-csv-to-qif-*.zip
